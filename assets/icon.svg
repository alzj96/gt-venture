<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">gt-venture 创业诊断</title>
  <!-- 放大镜 = 动手之前先查一遍；镜片里的十字把它分成四格 = 四道闸（人 / 事 / 地 / 钱），
       十字同时是准星 = ground truth；朱红那一格 = 最要命的那道闸。
       配色：宣纸底、墨色、朱砂。列表多是白底，外框描一圈淡墨线，免得边界化开 -->
  <rect width="512" height="512" rx="112" fill="#F4EEE2"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#1F1F1F" stroke-opacity="0.12" stroke-width="6"/>

  <!-- 镜片底色 -->
  <circle cx="220" cy="220" r="104" fill="#1F1F1F" fill-opacity="0.05"/>

  <!-- 最要命的那一格（右上） -->
  <path d="M220 220 L220 126 A94 94 0 0 1 314 220 Z" fill="#D9412B"/>

  <!-- 十字：把镜片分成四道闸 -->
  <g stroke="#1F1F1F" stroke-width="14" stroke-linecap="round">
    <line x1="220" y1="130" x2="220" y2="310"/>
    <line x1="130" y1="220" x2="310" y2="220"/>
  </g>

  <!-- 镜框 -->
  <circle cx="220" cy="220" r="118" fill="none" stroke="#1F1F1F" stroke-width="28"/>

  <!-- 手柄 -->
  <line x1="324" y1="324" x2="398" y2="398" stroke="#1F1F1F" stroke-width="46" stroke-linecap="round"/>
</svg>
