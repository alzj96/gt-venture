<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">gt-venture 创业诊断</title>
  <!-- 放大镜 = 动手之前先查一遍；镜片里的十字把它分成四格 = 四道闸（人 / 事 / 地 / 钱），
       十字同时是准星 = ground truth；亮起的那一格 = 最要命的那道闸 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12304A"/>
      <stop offset="1" stop-color="#0F5560"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <!-- 镜片底色 -->
  <circle cx="220" cy="220" r="104" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- 亮起的那一格（右上） -->
  <path d="M220 220 L220 126 A94 94 0 0 1 314 220 Z" fill="url(#gold)"/>

  <!-- 十字：把镜片分成四道闸 -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.92">
    <line x1="220" y1="130" x2="220" y2="310"/>
    <line x1="130" y1="220" x2="310" y2="220"/>
  </g>

  <!-- 镜框 -->
  <circle cx="220" cy="220" r="118" fill="none" stroke="#FFFFFF" stroke-width="28"/>

  <!-- 手柄 -->
  <line x1="324" y1="324" x2="398" y2="398" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
</svg>
